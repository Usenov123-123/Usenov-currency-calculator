<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конвертер валют</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efe9;--card:#f8faf7;--ink:#10231d;--mute:#5b6f66;--line:#cbd8cf;--accent:#0f5c47;--on-accent:#f8faf7;--field:#eef3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a16;--card:#15251f;--ink:#e6efe9;--mute:#93a99d;--line:#274036;--accent:#5fd0a5;--on-accent:#0e1a16;--field:#1b2f27}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a16;--card:#15251f;--ink:#e6efe9;--mute:#93a99d;--line:#274036;--accent:#5fd0a5;--on-accent:#0e1a16;--field:#1b2f27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:460px}
h1{font-size:20px;font-weight:700;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.amount{width:100%;font:700 40px/1.1 inherit;font-family:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:4px 0 10px;outline:none;border-radius:0}
.amount:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:20px}
select{width:100%;font:500 16px inherit;font-family:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
select:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:18px;cursor:pointer}
.swap:hover{background:var(--accent);color:var(--on-accent)}
.result{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.result .big{font-size:34px;font-weight:700;line-height:1.15;word-break:break-word}
.result .rate{color:var(--mute);font-size:14px;margin-top:4px}
h2{font-size:15px;font-weight:700;margin:24px 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border-bottom:0}
.list span:first-child{color:var(--mute)}
details{margin-top:18px}
summary{cursor:pointer;font-weight:500;font-size:15px}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rates div{display:flex;flex-direction:column}
.rates input{font:inherit;font-family:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
.reset{margin-top:10px;font:inherit;font-family:inherit;font-size:14px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Конвертер валют</h1>
  <div class="card">
    <label for="amount">Сумма</label>
    <input id="amount" class="amount" inputmode="decimal" value="100" autocomplete="off">
    <div class="row">
      <div><label for="from">Из</label><select id="from"></select></div>
      <button class="swap" id="swap" type="button" aria-label="Поменять валюты местами">⇄</button>
      <div><label for="to">В</label><select id="to"></select></div>
    </div>
    <div class="result" aria-live="polite">
      <div class="big" id="out"></div>
      <div class="rate" id="rate"></div>
    </div>
    <h2>Та же сумма в других валютах</h2>
    <ul class="list" id="others"></ul>
    <details>
      <summary>Изменить курсы</summary>
      <p class="note">Курсы указаны примерно и хранятся в самой странице. Введите актуальные значения: сколько единиц валюты в 1 USD.</p>
      <div class="rates" id="rates"></div>
      <button class="reset" id="reset" type="button">Сбросить курсы</button>
    </details>
  </div>
</main>
<script>
const DEFAULTS = [
  {c:"USD",n:"Доллар США",r:1},{c:"EUR",n:"Евро",r:0.86},{c:"KGS",n:"Кыргызский сом",r:87.5},
  {c:"RUB",n:"Российский рубль",r:80},{c:"KZT",n:"Казахстанский тенге",r:520},{c:"UZS",n:"Узбекский сум",r:12100},
  {c:"CNY",n:"Китайский юань",r:7.1},{c:"GBP",n:"Фунт стерлингов",r:0.76},{c:"TRY",n:"Турецкая лира",r:42},
  {c:"AED",n:"Дирхам ОАЭ",r:3.67},{c:"JPY",n:"Японская иена",r:155}
];
let cur = DEFAULTS.map(x => ({...x}));
try {
  const saved = JSON.parse(localStorage.getItem("fx-rates") || "null");
  if (saved) cur.forEach(x => { if (saved[x.c] > 0) x.r = saved[x.c]; });
} catch (e) {}

const $ = id => document.getElementById(id);
const amountEl = $("amount"), fromEl = $("from"), toEl = $("to");
const rate = code => cur.find(x => x.c === code).r;
const fmt = (v, max = 2) => new Intl.NumberFormat("ru-RU", {maximumFractionDigits: v !== 0 && Math.abs(v) < 1 ? 6 : max}).format(v);
const parse = s => parseFloat(String(s).replace(/\s/g, "").replace(",", ".")) || 0;
const conv = (v, a, b) => v / rate(a) * rate(b);

cur.forEach(x => {
  const label = x.c + " — " + x.n;
  fromEl.add(new Option(label, x.c));
  toEl.add(new Option(label, x.c));
});
fromEl.value = "USD"; toEl.value = "KGS";

function render() {
  const v = parse(amountEl.value), a = fromEl.value, b = toEl.value;
  $("out").textContent = fmt(conv(v, a, b)) + " " + b;
  $("rate").textContent = "1 " + a + " = " + fmt(conv(1, a, b), 4) + " " + b;
  $("others").innerHTML = cur.filter(x => x.c !== a)
    .map(x => `<li><span>${x.n}</span><span>${fmt(conv(v, a, x.c))} ${x.c}</span></li>`).join("");
}

function buildRates() {
  $("rates").innerHTML = cur.filter(x => x.c !== "USD")
    .map(x => `<div><label for="r-${x.c}">${x.c}</label><input id="r-${x.c}" data-c="${x.c}" inputmode="decimal" value="${x.r}"></div>`).join("");
}

$("rates").addEventListener("input", e => {
  const code = e.target.dataset.c, v = parse(e.target.value);
  if (!code || v <= 0) return;
  cur.find(x => x.c === code).r = v;
  try {
    const o = {}; cur.forEach(x => o[x.c] = x.r);
    localStorage.setItem("fx-rates", JSON.stringify(o));
  } catch (err) {}
  render();
});

$("reset").addEventListener("click", () => {
  cur = DEFAULTS.map(x => ({...x}));
  try { localStorage.removeItem("fx-rates"); } catch (e) {}
  buildRates(); render();
});
$("swap").addEventListener("click", () => { const t = fromEl.value; fromEl.value = toEl.value; toEl.value = t; render(); });
[amountEl, fromEl, toEl].forEach(el => el.addEventListener("input", render));

buildRates(); render();
</script>
</body>
</html>
